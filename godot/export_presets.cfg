; Export targets for LEVO Printer Farm.
;
; Web is the one that matters first: it is how the game reaches players from
; inside the Levonis platform. Android and iOS are ready for when the game is
; shipped as a store build.
;
; Exporting needs the matching Godot export templates installed.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../client/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
